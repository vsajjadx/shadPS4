name: Fork Release

on:
  push:
    paths: [.github/workflows/fork-release.yml]

env:
  RUN_ID: "39749638563"
  TAG: perf-2026-10-22
  TARGET: a4691f0ad4e0c4c44175dfd55d40dd5a9ea6fa80

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ env.RUN_ID }} --repo ${{ github.repository }} --pattern 'shadps4-win64-sdl-20*' --dir build

      - name: Package
        run: |
          cd build/shadps4-win64-sdl-20*
          zip -r ../../shadps4-win64-sdl-${{ env.TAG }}.zip .

      - name: Write release notes
        run: |
          cat > notes.md <<'EOF'
          ## Performance: no more GPU stalls on CPU readbacks

          This build removes the main bottleneck in games that read GPU results back on the CPU every frame, and fixes several rendering bugs and crashes found while testing.

          ### Performance
          - **Readback prefetch.** Every CPU read of a page the GPU had written stopped the game thread until the GPU thread had finished all submitted work and downloaded the page. inFAMOUS First Light does this about four times a frame, so the game thread, the GPU thread and the GPU took turns instead of running in parallel (about 30% of each thread's time was spent waiting and GPU load stayed around 30%). The emulator now remembers which pages the game reads back and starts downloading new GPU writes to them asynchronously at the next fence, so the data is already in memory when the game reads it. Blocking readbacks went from about 4 per frame to about 0.1.
          - **Cheaper buffer barrier tracking.** Re-adding a range that was already tracked split it into a vector and merged it back, shifting every entry after it twice. With lists of more than ten thousand ranges this took about 10% of the GPU thread.
          - **Result in inFAMOUS First Light (RTX 3080):** 26 FPS to 41 FPS standing still at the same spot. Other games that read GPU data back on the CPU (for example inFAMOUS Second Son, Driveclub, UFC 4) should benefit as well.

          ### Rendering fixes
          - **The Order: 1886:** black flickering blotches on character faces are fixed. The depth prepass and the color pass computed the same vertex position with different fp32 denormal handling on NVIDIA, so the color pass failed its depth test by one bit in scattered spots.
          - **NHL 24:** player shadow jitter in the opening cutscene is gone with the same fix.

          ### Stability
          - Fixed a GPU crash (device lost) and an assertion that could happen while loading with an empty shader cache: shader translation workers patched shared SRT walker code after reading stale game data.

          ### Notes
          - The first launch of each game rebuilds its shader cache once, because the shader translator changed; expect some stutter the first time a scene is seen.
          - Requirements: Windows 64-bit and a GPU with Vulkan 1.3 support. Extract the zip and run `shadPS4.exe`.

          EOF
          sed -i 's/^          //' notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.TAG }}" shadps4-win64-sdl-${{ env.TAG }}.zip \
            --repo ${{ github.repository }} \
            --target ${{ env.TARGET }} \
            --title "Performance: readback prefetch (${{ env.TAG }})" \
            --notes-file notes.md
