name: Fork Release

on:
  push:
    paths: [.github/workflows/fork-release.yml]

env:
  RUN_ID: "41337194147"
  TAG: dlss5-2026-11-01b
  TARGET: a50102d2ab9523cfbac29cdfa3cc1ab0c5cffaf6

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ env.RUN_ID }} --repo ${{ github.repository }} --pattern 'shadPS4-AntiCrash-win64-*' --dir build

      - name: Package
        run: |
          cd build/shadPS4-AntiCrash-win64-*
          zip -r ../../shadPS4-win64-${{ env.TAG }}.zip .

      - name: Write release notes
        run: |
          cat > notes.md <<'EOF'
          ## DLSS5 arrives

          Three new ways to make your games look sharper and feel smoother, each a single key press away. Everything lives in **Settings → Graphics**, and everything is off until you turn it on.

          ### Hotkeys in game
          | Key | What it does |
          | :---: | :--- |
          | `1` | **Frame Generation**: more frames, smoother motion |
          | `2` | **DLSS5**: sharper, cleaner image |
          | `3` | **Boost**: extra performance when you need it |

          Each key switches its feature on or off, and a small notice tells you the new state.

          ### Which settings should I use?
          - **Any card:** switch on only what you like. DLSS5 is the one for image quality, Frame Generation the one for fluid motion.
          - **RTX 20 and 30 series:** we recommend turning on **Boost**, **Frame Generation** and **Auto Quality** together. Auto Quality picks the render resolution for you, so you get a smooth, steady experience without tuning anything.
          - All of these options are in **Settings → Graphics**. The DLSS5 group sits under Graphics Device, and Auto Quality is in the Graphics tab of the launcher.

          ### Also in this release
          - **The Order: 1886:** the black bands and scrambled blocks that could appear over the title screen come from images sharing memory with a different layout. The emulator now carries a render result between such images only when their layout really matches. This is a fix based on the log and the code, so tell us how it looks on your machine.
          - **Auto Quality:** ticking it in the launcher now turns DLSS5 Boost on for you (it only works with Boost), instead of staying greyed out until Boost was ticked.
          - **Defaults:** DLSS5 options start off, brightness and contrast start at 100.
          - **Alt+Enter** switches the window to borderless fullscreen when the game runs in a window.
          - **Frame counter:** the FPS counter shows the rate you actually see while frame generation runs.

          ### Notes
          - Requirements: Windows 64-bit and a GPU with Vulkan 1.3.
          - Extract the zip and run `shadPS4QtLauncher.exe` (or `shadPS4.exe` directly). Existing saves and settings stay untouched.

          EOF
          sed -i 's/^          //' notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.TAG }}" shadPS4-win64-${{ env.TAG }}.zip \
            --repo ${{ github.repository }} \
            --target ${{ env.TARGET }} \
            --title "DLSS5 arrives: frame generation, Boost and Auto Quality, one key each (${{ env.TAG }})" \
            --notes-file notes.md \
            --latest
