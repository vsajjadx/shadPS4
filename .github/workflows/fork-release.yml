name: Fork Release

on:
  push:
    paths: [.github/workflows/fork-release.yml]

env:
  RUN_ID: "39410737976"
  TAG: framegen-2026-10-20
  TARGET: cd10110afc486bb25a2ca015cdcdd2a7422b9ffb

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ env.RUN_ID }} --repo ${{ github.repository }} --pattern 'shadps4-win64-sdl-20*' --dir build

      - name: Package
        run: |
          cd build/shadps4-win64-sdl-20*
          zip -r ../../shadps4-win64-sdl-${{ env.TAG }}.zip .

      - name: Write release notes
        run: |
          cat > notes.md <<'EOF'
          ## FSR 3.1 frame generation is fully enabled

          Frame generation now works end to end: one interpolated frame is generated for every game frame, whatever the display refresh rate, and the flicker between real and generated frames is fixed.

          Fix in this build: the generated frame was presented with the alpha FSR writes (its inpainting weight, close to zero), so it was blended with the black window background and shown almost black between two real frames. It is now presented opaque.

          ### How to use
          Requirements: Windows 64-bit and a GPU with Vulkan 1.3 support.

          1. Extract the zip and start `shadPS4.exe`, then launch your game.
          2. While the game is running, press `1` to turn frame generation ON and `2` to turn it OFF. A notification at the bottom right confirms the state. No modifier keys (Ctrl, Alt, Shift) may be held.
          3. To keep it on at every start, set `frameGenerationEnabled = true` in the `[GPU]` section of your shadPS4 `config.toml`.

          ### Notes
          - Interpolated frames are skipped on scene cuts, on HDR output, and when the game frame interval is outside 2 ms to 80 ms.
          - If frame generation cannot be created on your GPU, it turns itself off and the notification says it is not available.
          - Tested on NHL 24 (CUSA37933) with an RTX 3080.

          ---

          ## فریم جنریشن FSR 3.1 کامل فعاله

          فریم جنریشن حالا کامل کار می‌کنه: به ازای هر فریم بازی یک فریم تولیدشده ساخته می‌شه، مستقل از نرخ نوسازی مانیتور، و فلیکر بین فریم واقعی و تولیدشده رفع شده.

          علت فلیکر: فریم تولیدشده با آلفایی که FSR می‌نویسه (وزن inpainting، نزدیک صفر) نمایش داده می‌شد و با پس‌زمینه‌ی مشکی ترکیب می‌شد، پس بین دو فریم واقعی تقریباً سیاه دیده می‌شد. حالا کاملاً مات نمایش داده می‌شه.

          ### نحوه استفاده
          نیازمندی‌ها: ویندوز ۶۴ بیتی و کارت گرافیکی با پشتیبانی Vulkan 1.3.

          ۱. فایل زیپ رو اکسترکت کن، `shadPS4.exe` رو اجرا کن و بازی رو بالا بیار.
          ۲. وسط بازی کلید `1` رو بزن تا فریم جنریشن روشن بشه و کلید `2` تا خاموش بشه. پایین سمت راست صفحه یک اعلان وضعیت رو نشون می‌ده. موقع زدن کلید، Ctrl و Alt و Shift نباید نگه داشته شده باشن.
          ۳. برای اینکه همیشه روشن باشه، در بخش `[GPU]` فایل `config.toml` شاد‌پی‌اس‌فور مقدار `frameGenerationEnabled = true` رو بذار.

          ### نکته‌ها
          - در تغییر صحنه (scene cut)، خروجی HDR و وقتی فاصله‌ی فریم‌های بازی خارج از ۲ تا ۸۰ میلی‌ثانیه باشه، فریم تولیدشده نمایش داده نمی‌شه.
          - اگه روی کارت گرافیک شما ساخته نشه، خودش خاموش می‌شه و اعلان «not available» نشون داده می‌شه.
          - روی NHL 24 و کارت RTX 3080 تست شده.
          EOF
          sed -i 's/^          //' notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.TAG }}" shadps4-win64-sdl-${{ env.TAG }}.zip \
            --repo ${{ github.repository }} \
            --target ${{ env.TARGET }} \
            --title "FSR 3.1 frame generation (${{ env.TAG }})" \
            --notes-file notes.md
