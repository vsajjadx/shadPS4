name: Fork Release

on:
  push:
    paths: [.github/workflows/fork-release.yml]

env:
  RUN_ID: "39769845392"
  TAG: fix-cutscene-freeze-2026-10-22
  TARGET: bb41627e98d34610016507ff648995c3b0077716

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ env.RUN_ID }} --repo ${{ github.repository }} --pattern 'shadps4-win64-sdl-20*' --dir build

      - name: Package
        run: |
          cd build/shadps4-win64-sdl-20*
          zip -r ../../shadps4-win64-sdl-${{ env.TAG }}.zip .

      - name: Write release notes
        run: |
          cat > notes.md <<'EOF'
          ## Fix: intermittent freezes in cutscenes (event flag lost wakeup)

          The Grand Tour Game sometimes froze for good in the middle of its Bink cutscenes: the picture stopped, the game kept running, and buttons did nothing. It happened only some of the time, and it was a bug in the emulator, not in the game.

          ### Cause
          The game's audio engine (Wwise) waits on an event flag that is cleared automatically when a waiter takes it. When the flag was set, the waiter was marked as satisfied but stayed in the waiter list until its thread actually ran again. If the flag was set a second time in that short window, the emulator matched the already satisfied waiter again and cleared the bits once more, so the second event was consumed by a thread that had already taken the first one. The next wait never saw it and slept forever, which stopped the sound bank loader, the video waiting on it, and the game waiting on the video.

          On the PS4 a satisfied waiter leaves the queue at once. Now sets, cancels and the single waiter check only count waiters that have not been woken yet, which matches that behavior.

          This can also fix random hangs in other games that use event flags with auto-clear, including games that use the Wwise audio engine.

          ### Also included
          - Vulkan commands recorded on their own thread (about 20-25% more FPS in inFAMOUS First Light).
          - Readback prefetch: no more full GPU stalls when games read GPU results back on the CPU.
          - Fixes for black blotches on faces in The Order: 1886, NHL 24 cutscene shadow jitter, and a crash while loading with an empty shader cache.

          ### Notes
          - Tested on The Grand Tour Game (CUSA13903) with an RTX 3080: the cutscene that froze plays through.
          - Requirements: Windows 64-bit and a GPU with Vulkan 1.3 support. Extract the zip and run `shadPS4.exe`.

          EOF
          sed -i 's/^          //' notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.TAG }}" shadps4-win64-sdl-${{ env.TAG }}.zip \
            --repo ${{ github.repository }} \
            --title "Fix: cutscene freezes from lost event flag wakeups (${{ env.TAG }})" \
            --notes-file notes.md
