name: Fork Release

on:
  push:
    paths: [.github/workflows/fork-release.yml]

env:
  RUN_ID: "39829203132"
  TAG: smooth-brightness-2026-10-22
  TARGET: c829eb62244ab7bcc62bbef2bdabd7d4363013f6

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ env.RUN_ID }} --repo ${{ github.repository }} --pattern 'shadPS4-AntiCrash-win64-*' --dir build

      - name: Package
        run: |
          cd build/shadPS4-AntiCrash-win64-*
          zip -r ../../shadPS4-win64-${{ env.TAG }}.zip .

      - name: Write release notes
        run: |
          cat > notes.md <<'EOF'
          ## Smoother play, brightness and contrast sliders, and the launcher with it

          This release ships the emulator together with the Qt launcher.

          ### Stalls fixed
          - **The emulator froze the picture 3 and 6 minutes into every session.** A diagnostic dump suspended every thread and wrote their state to the log at those times, even when nothing was wrong. In UFC 4 that was the severe stall that came once or twice in every fight (seconds long), and in inFAMOUS Second Son a hitch of about 0.4 s. The dumps are gone; the dump on a real freeze (no frame for 10 seconds) and the one on Ctrl+L remain.
          - **Compute pipelines no longer stop the picture while they compile.** They were always built on the GPU thread, which in inFAMOUS Second Son meant hundreds of 25-300 ms hitches in a new area. Compute passes the game runs every frame are now built in the background like graphics pipelines; the picture keeps moving and an effect can show a few frames late the first time it appears. One-off passes are still built at once.

          ### Brightness and contrast
          - New brightness setting, from 25% to 300%. It lifts or lowers the tones between black and white, so dark scenes become visible without washing out bright areas.
          - New contrast setting, from 25% to 300%, which spreads the tones apart around mid-grey or brings them closer together.
          - In game: right-click the window's title bar and choose **Brightness / Contrast...** for two sliders that apply at once, with buttons to save them for the game or for all games.
          - In the launcher: **Graphics** tab, Image Quality, saved for all games or per game like the other settings.
          - inFAMOUS Second Son starts at 180%, since its interiors still show darker than on the console; a brightness you choose takes over.

          ### Also
          - Starting a game with RenderDoc enabled no longer freezes it for seconds.

          ### Notes
          - The first run of a game after this update compiles its shaders again, so expect some hitching in that first session.
          - Requirements: Windows 64-bit and a GPU with Vulkan 1.3 support. Extract the zip and run `shadPS4QtLauncher.exe` (or `shadPS4.exe` directly).

          EOF
          sed -i 's/^          //' notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.TAG }}" shadPS4-win64-${{ env.TAG }}.zip \
            --repo ${{ github.repository }} \
            --title "Smoother play, brightness and contrast, launcher included (${{ env.TAG }})" \
            --notes-file notes.md
