name: Fork Release

on:
  push:
    paths: [.github/workflows/fork-release.yml]

env:
  RUN_ID: "40105793424"
  TAG: coldwar-green-stripes-fix-2026-10-24
  TARGET: c487af21a1e2cef0cf7afc150d17d45bcf38cbb5

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ env.RUN_ID }} --repo ${{ github.repository }} --pattern 'shadPS4-AntiCrash-win64-*' --dir build

      - name: Package
        run: |
          cd build/shadPS4-AntiCrash-win64-*
          zip -r ../../shadPS4-win64-${{ env.TAG }}.zip .

      - name: Write release notes
        run: |
          cat > notes.md <<'EOF'
          ## Call of Duty: Black Ops Cold War: green stripes in the menus fixed

          - **Fixed: green striped image over the Multiplayer menu.** Two compute shaders of the game use the 64-bit buffer atomic add (`BUFFER_ATOMIC_ADD_X2`), which the shader translator did not know. Their translation failed and every dispatch using them was skipped. The instruction is now translated.
          - 64-bit buffer atomics that ask for the old value (`glc`) no longer stop on an assertion; the old value is written to the two registers it belongs in.

          Not tested in game by the author yet: if the image is still wrong, send a new log.

          This release ships the emulator together with the Qt launcher. Requirements: Windows 64-bit and a GPU with Vulkan 1.3 support. Extract the zip and run `shadPS4QtLauncher.exe` (or `shadPS4.exe` directly).

          EOF
          sed -i 's/^          //' notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.TAG }}" shadPS4-win64-${{ env.TAG }}.zip \
            --repo ${{ github.repository }} \
            --title "Cold War: green stripes fixed (${{ env.TAG }})" --target ${{ env.TARGET }} \
            --notes-file notes.md
