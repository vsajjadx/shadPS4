name: Fork Release

on:
  push:
    paths: [.github/workflows/fork-release.yml]

env:
  RUN_ID: "42375743221"
  TAG: allgames-2026-11-07-2
  TARGET: fd47df01d4c5d9018aa2e0f7984b9e0e35bec21f

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ env.RUN_ID }} --repo ${{ github.repository }} --pattern 'shadPS4-AntiCrash-win64-*' --dir build

      - name: Package
        run: |
          cd build/shadPS4-AntiCrash-win64-*
          zip -r ../../shadPS4-win64-${{ env.TAG }}.zip .

      - name: Write release notes
        run: |
          cat > notes.md <<'EOF'
          ## Every game, one emulator: crash, freeze and DLSS5 fixes

          This release fixes the underlying emulation behind crashes and freezes in several games instead of adding per-game workarounds, makes DLSS5 steady in every game, and redesigns the launcher.

          ### Game fixes
          - **NHL 24:** fixed the freeze where the GPU stopped for good. Buffer copies could take a shortcut through the game's own memory while the GPU had newer data for the same bytes, so stale values reached the game as dispatch sizes (billions of workgroups). Copies of anything the GPU wrote now always use the GPU's data. Memory use also dropped from over 20 GB to about 4 GB. A vertex format some of its shaders use (10_11_11 in normalized and integer forms) now translates, so those draws are no longer skipped.
          - **Marvel's Spider-Man: Miles Morales:** boots on a regular PS4 setup. The emulator reported a 5120x2880 TV to a PS4 that can only output 1080p, and the game took a 4K path that does not exist on that console. The reported output now never exceeds what the console can display: 1080p on PS4, 2160p on PS4 Pro.
          - **Red Dead Redemption 2:** fixed two crashes, one while tessellation shaders were still compiling and one when changing the memory type of a mapping that spans several memory areas.
          - **EA SPORTS FC 27:** compute shaders that use jump tables (switch statements) now translate instead of being skipped, which fixes scrambled sequences. The picture no longer turns red and overexposed (a regression in the previous release is fixed too): wave64 operations inside loops are only rewritten when every wave runs the loop the same number of times.
          - **UFC 4:** fixed a freeze after flips.

          ### DLSS5
          - Runs on the game's scene before post-processing and the HUD, so text and menus stay crisp, with no halos around players or text.
          - Finds the scene reliably in every game, including games that render with MSAA (UFC 4) and dynamic resolution (FC 27). This removes the flicker and the frame-rate drop in fullscreen.
          - Choose the network in Settings: Default, Full Quality or Fast. Settings changes apply while the game runs.

          ### Launcher
          - Redesigned settings with a sidebar, search and shorter descriptions, and a refreshed main window.
          - The log section lists every log class and level, so logs can be turned on or off without a new build.
          - The Null GPU option was removed.

          ### Other improvements
          - Much faster boot, including when running a PKG directly (FC 27: 46 s down to 11 s).
          - PS4 Pro mode: textures in the Pro's alternate memory layout are read correctly, and Pro-only shader instructions decode.
          - A game's own config file can choose its readback settings.
          - Linear image readbacks are now really on for every game. A settings bug left them off, so games that read their exposure back on the CPU (EA SPORTS FC 27) showed a washed-out, overbright picture.
          - Crash logs now list code addresses for every game.

          ### Notes
          - Requirements: Windows 64-bit and a GPU with Vulkan 1.3. DLSS5 needs an NVIDIA RTX card.
          - Extract the zip and run `shadPS4QtLauncher.exe` (or `shadPS4.exe` directly). Existing saves and settings stay untouched.
          EOF
          sed -i 's/^          //' notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release create "${{ env.TAG }}" shadPS4-win64-${{ env.TAG }}.zip \
            --repo ${{ github.repository }} \
            --target ${{ env.TARGET }} \
            --title "Crash, freeze and DLSS5 fixes for every game (${{ env.TAG }})" \
            --notes-file notes.md \
            --latest 2> err.txt; then
            gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="release failed: $(tail -c 1500 err.txt)"
            exit 1
          fi
