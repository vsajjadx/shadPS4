name: Fork Release

on:
  push:
    paths: [.github/workflows/fork-release.yml]

env:
  RUN_ID: "39762072080"
  TAG: perf-recorder-2026-10-22
  TARGET: 551f6e7336f33f00c224cd2c55d4902c1c0ea47c

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ env.RUN_ID }} --repo ${{ github.repository }} --pattern 'shadps4-win64-sdl-20*' --dir build

      - name: Package
        run: |
          cd build/shadps4-win64-sdl-20*
          zip -r ../../shadps4-win64-sdl-${{ env.TAG }}.zip .

      - name: Write release notes
        run: |
          cat > notes.md <<'EOF'
          ## Performance: Vulkan commands recorded on their own thread

          The GPU command processor thread was the bottleneck: besides translating the PS4 command stream it spent about a fifth of its time inside the Vulkan driver recording commands, while the game thread mostly waited for it. Command recording now runs on a separate thread.

          ### What changed
          - **Recording thread.** The main renderer now writes each Vulkan command, together with the arrays it uses, into a compact command chunk instead of calling the driver directly. A dedicated thread (`shadPS4:GpuCommandRecorder`) replays the chunks in order into the command buffer and submits it to the GPU. Translating the next commands and recording the previous ones now happen at the same time on two CPU cores.
          - **Ordering is preserved.** Host passes that need the command buffer itself (FSR, post processing, frame generation) first wait for every queued command, so nothing is reordered. A frame is only handed to presentation after its commands are submitted.
          - Presentation and flip work still record directly, as before.

          ### Result
          - **inFAMOUS First Light (RTX 3080):** 28-29 FPS to 35-36 FPS at the same spot, measured with the same build with the recording thread turned on and off.
          - The Order: 1886, Driveclub and NHL 24 were tested and run without errors.

          ### Also included (from the previous release)
          - Readback prefetch: no more full GPU stalls when games read GPU results back on the CPU.
          - Fixes for black blotches on faces in The Order: 1886, NHL 24 cutscene shadow jitter, and a crash while loading with an empty shader cache.

          ### Notes
          - This is a large change to how commands reach the GPU. If a game crashes or shows rendering errors with this build but not with `perf-2026-10-22`, please report it.
          - Requirements: Windows 64-bit and a GPU with Vulkan 1.3 support. Extract the zip and run `shadPS4.exe`.

          EOF
          sed -i 's/^          //' notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.TAG }}" shadps4-win64-sdl-${{ env.TAG }}.zip \
            --repo ${{ github.repository }} \
            --target ${{ env.TARGET }} \
            --title "Performance: recording thread (${{ env.TAG }})" \
            --notes-file notes.md
