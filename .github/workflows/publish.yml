name: Publish builds
on:
  push:
    branches: [publish/*]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download the two Windows artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out && cd out
          gh run download 38715365468 -R "${{ github.repository }}" -n shadps4-win64-sdl-2026-10-15-4c3f442 -D f2
          gh run download 38709291848 -R "${{ github.repository }}" -n shadps4-win64-sdl-2026-10-15-9c6a436 -D f3
          ls -la f2 f3
          (cd f2 && zip -q ../shadPS4-f2-full-v020-4c3f442.zip shadPS4.exe)
          (cd f3 && zip -q ../shadPS4-f3-lite-v020-9c6a436.zip shadPS4.exe)
          ls -la
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create builds-2026-10-15c out/shadPS4-f2-full-v020-4c3f442.zip out/shadPS4-f3-lite-v020-9c6a436.zip \
            -R "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "shadPS4 builds 2026-10-15c (Windows)" \
            --notes "f2 = full 1886 fork on upstream main 314c456 (4c3f442). f3 = lite 1886 fixes on upstream main 314c456 (9c6a436). Windows x64, shadPS4.exe inside the zip."
