name: Publish builds
on:
  push:
    branches: [publish/*]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download the two Windows artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out && cd out
          gh run download 38656260644 -R "${{ github.repository }}" -n shadps4-win64-sdl-2026-10-14-6af74d3 -D d1
          gh run download 38660708010 -R "${{ github.repository }}" -n shadps4-win64-sdl-2026-10-15-5f643ac -D e1
          ls -la d1 e1
          (cd d1 && zip -q ../shadPS4-d1-sep22-v0.19.zip shadPS4.exe)
          (cd e1 && zip -q ../shadPS4-e1-oct11-v0.19.1.zip shadPS4.exe)
          ls -la
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create builds-2026-10-15b out/shadPS4-d1-sep22-v0.19.zip out/shadPS4-e1-oct11-v0.19.1.zip \
            -R "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "shadPS4 bisect builds 2026-10-15 (Windows)" \
            --notes "d1 = 13-commit 1886 fork + input/text fixes on upstream 2026-09-22. e1 = same on upstream 2026-10-11. Windows x64, shadPS4.exe inside the zip. For finding which upstream step breaks The Order."
