name: Publish builds
on:
  push:
    branches: [publish/*]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download the two Windows artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out && cd out
          gh run download 38735524400 -R "${{ github.repository }}" -n shadps4-win64-sdl-2026-10-15-2d8b88d -D f2
          gh run download 38735522995 -R "${{ github.repository }}" -n shadps4-win64-sdl-2026-10-15-9aa6325 -D f3
          ls -la f2 f3
          (cd f2 && zip -q ../shadPS4-f2-full-v020-2d8b88d.zip shadPS4.exe)
          (cd f3 && zip -q ../shadPS4-f3-lite-v020-9aa6325.zip shadPS4.exe)
          ls -la
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create builds-2026-10-15e out/shadPS4-f2-full-v020-2d8b88d.zip out/shadPS4-f3-lite-v020-9aa6325.zip \
            -R "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "shadPS4 builds 2026-10-15e (Windows)" \
            --notes "f2 (2d8b88d) and f3 (9aa6325) on upstream main 314c456. Adds null images for The Order: 1886 cs 0x804aeead and rejects T#s with unmappable formats or tile modes. Windows x64, shadPS4.exe inside the zip."
